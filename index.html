<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e28" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pop Star" />
<title>Pop Star</title>
<style>
  :root{
    --cell: 40px;
    --gap: 3px;
    --tile: 34px;
    --bg1: #24306b;
    --bg2: #0a0e28;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 700px at 50% -15%, var(--bg1), transparent 65%),
      radial-gradient(700px 500px at 15% 110%, #1b2a63, transparent 60%),
      linear-gradient(180deg, #101638, var(--bg2));
    color: #eaf0ff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .app{
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- HUD ---------- */
  .hud{
    display: flex;
    gap: 8px;
    padding: 10px 12px 0;
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
  }

  .stat{
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    padding: 6px 8px 7px;
    border-radius: 14px;
    background: linear-gradient(180deg, #1e2860, #141c48);
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 8px 20px -12px #000, inset 0 1px 0 rgba(255,255,255,.08);
  }

  .stat .label{
    display: block;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-weight: 800;
    color: #8494cc;
  }

  .stat .val{
    display: block;
    font-size: clamp(17px, 5vw, 22px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat.mid{
    flex: 1.6 1 0;
    background: linear-gradient(180deg, #2b2f7a, #1a1f55);
    border-color: rgba(255,215,94,.22);
  }

  .stat.mid .val{
    font-size: clamp(22px, 6.4vw, 30px);
    color: #ffd75e;
    text-shadow: 0 0 20px rgba(255,200,60,.45);
  }

  /* ---------- Board ---------- */
  .board-wrap{
    display: grid;
    place-items: center;
    padding: 10px 12px;
    min-height: 0;
  }

  .board{
    position: relative;
    border-radius: 22px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.07), transparent 55%),
      linear-gradient(180deg, #1a2354, #101740);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.055),
      inset 0 2px 22px rgba(0,0,0,.55),
      0 24px 60px -26px #000;
    touch-action: manipulation;
  }

  .board.noanim .tile{ transition: none !important; }

  .tile{
    position: absolute;
    left: 0;
    top: 0;
    width: var(--tile);
    height: var(--tile);
    transition: transform .23s cubic-bezier(.25,.85,.35,1);
    will-change: transform;
  }

  .face{
    position: absolute;
    inset: 0;
    border-radius: 27%;
    display: grid;
    place-items: center;
    background:
      linear-gradient(160deg, var(--light) 0%, var(--base) 48%, var(--dark) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.5),
      inset 0 -3px 7px rgba(0,0,0,.35),
      0 3px 7px rgba(0,0,0,.35);
    transition: transform .16s ease, filter .16s ease, opacity .2s ease;
    animation: spawnIn .36s cubic-bezier(.2,1.4,.5,1) backwards;
    animation-delay: calc(var(--d, 0) * 14ms);
  }

  .face::before{
    content: "";
    position: absolute;
    left: 12%;
    right: 32%;
    top: 8%;
    height: 34%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events: none;
  }

  .star{
    width: 64%;
    height: 64%;
    background: linear-gradient(180deg, #ffffff, rgba(255,255,255,.62));
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.28));
    pointer-events: none;
  }

  .tile.sel .face{
    transform: scale(1.07);
    filter: brightness(1.22) saturate(1.15);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.75),
      inset 0 -3px 7px rgba(0,0,0,.3),
      0 0 0 2px rgba(255,255,255,.85),
      0 0 18px 4px rgba(255,255,255,.35);
  }

  .tile.sel .star{ animation: starPulse .7s ease-in-out infinite alternate; }

  .tile.pop{ z-index: 6; }
  .tile.pop .face{
    transform: scale(1.5);
    opacity: 0;
    transition: transform .26s cubic-bezier(.2,.7,.4,1), opacity .26s ease-out;
    animation: none;
  }

  .tile.bad .face{ animation: shake .3s ease; }

  .gain{
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(15px, 4.2vw, 21px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,215,94,.7);
    pointer-events: none;
    z-index: 8;
    animation: gainUp .9s ease-out forwards;
    white-space: nowrap;
  }

  .p{
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 7;
  }

  /* ---------- Footer ---------- */
  .bar{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px calc(10px + env(safe-area-inset-bottom));
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
  }

  .info{
    flex: 1;
    min-width: 0;
    font-size: clamp(11px, 3.2vw, 13px);
    font-weight: 700;
    color: #93a2d8;
    line-height: 1.35;
  }

  .info b{ color: #ffd75e; }

  .iconbtn{
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(180deg, #222c68, #161e4c);
    color: #dbe4ff;
    font-size: 17px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
    box-shadow: 0 6px 16px -10px #000, inset 0 1px 0 rgba(255,255,255,.1);
  }

  .iconbtn:active{ transform: scale(.93); filter: brightness(1.2); }

  /* ---------- Overlay ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(6,9,26,.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
    opacity: 1;
    transition: opacity .22s ease;
  }

  .overlay.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .card{
    width: min(360px, 100%);
    padding: 24px 22px 20px;
    border-radius: 24px;
    text-align: center;
    background: linear-gradient(180deg, #232e6e, #131a45);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 40px 80px -30px #000, inset 0 1px 0 rgba(255,255,255,.12);
    transform: translateY(0) scale(1);
    transition: transform .28s cubic-bezier(.2,1.2,.4,1);
  }

  .overlay.hidden .card{ transform: translateY(12px) scale(.96); }

  .card h2{
    margin: 0 0 6px;
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 900;
    letter-spacing: -.01em;
    background: linear-gradient(180deg, #fff, #ffd75e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.3));
  }

  .card p{
    margin: 0 0 14px;
    font-size: 13.5px;
    line-height: 1.55;
    color: #aab6e8;
  }

  .lines{
    display: grid;
    gap: 6px;
    margin: 0 0 18px;
  }

  .line{
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13.5px;
    font-weight: 700;
    color: #c8d2f7;
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
  }

  .line b{ color: #ffd75e; font-variant-numeric: tabular-nums; }

  .btn{
    width: 100%;
    padding: 13px 18px;
    border: 0;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .02em;
    color: #22180a;
    background: linear-gradient(180deg, #ffe07a, #ffb92e);
    box-shadow: 0 10px 22px -10px rgba(255,180,40,.9), inset 0 -3px 0 rgba(150,90,0,.25), inset 0 2px 0 rgba(255,255,255,.6);
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }

  .btn:active{ transform: translateY(1px) scale(.985); filter: brightness(1.06); }

  @keyframes spawnIn{
    from{ transform: scale(.2); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }

  @keyframes starPulse{
    from{ transform: scale(1); }
    to{ transform: scale(1.18); }
  }

  @keyframes shake{
    0%, 100%{ transform: translateX(0); }
    25%{ transform: translateX(-4px) rotate(-4deg); }
    75%{ transform: translateX(4px) rotate(4deg); }
  }

  @keyframes gainUp{
    0%{ transform: translate(-50%, -50%) scale(.6); opacity: 0; }
    18%{ transform: translate(-50%, -62%) scale(1.15); opacity: 1; }
    100%{ transform: translate(-50%, -190%) scale(1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .tile, .face{ transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat">
      <span class="label">Stage</span>
      <span class="val" id="stage">1</span>
    </div>
    <div class="stat mid">
      <span class="label">Punkte</span>
      <span class="val" id="score">0</span>
    </div>
    <div class="stat">
      <span class="label">Rekord</span>
      <span class="val" id="best">0</span>
    </div>
  </header>

  <main class="board-wrap" id="wrap">
    <div class="board" id="board"></div>
  </main>

  <footer class="bar">
    <div class="info" id="info">Tippe auf 2+ gleiche Sterne</div>
    <button class="iconbtn" id="sound" title="Ton an/aus" aria-label="Ton an oder aus">🔊</button>
    <button class="iconbtn" id="restart" title="Neustart" aria-label="Neustart">↻</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="ovTitle">Pop Star</h2>
    <p id="ovText"></p>
    <div class="lines" id="ovLines"></div>
    <button class="btn" id="ovBtn">Los geht's</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- config
  const ROWS = 10;
  const COLS = 10;

  const COLORS = [
    { base: "#3d8bff", light: "#9cc8ff", dark: "#1c53b8" }, // blau
    { base: "#54c94a", light: "#b0f396", dark: "#2a8a2b" }, // grün
    { base: "#ff4d6d", light: "#ffa4b6", dark: "#b81f3c" }, // rot
    { base: "#ffc22e", light: "#ffe694", dark: "#c88700" }, // gelb
    { base: "#a35bff", light: "#dcbcff", dark: "#6a26c9" }, // lila
  ];

  const BEST_KEY = "popstar.best";

  function readBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch (e) {
      return 0;
    }
  }

  function writeBest(v) {
    try {
      localStorage.setItem(BEST_KEY, String(v));
    } catch (e) {
      /* Speicher nicht verfügbar (z. B. Privatmodus) */
    }
  }

  // ---------------------------------------------------------------- state
  let grid = [];                 // grid[r][c] -> tile | null
  let tiles = new Map();         // id -> tile
  let selected = [];
  let score = 0;
  let shownScore = 0;
  let stage = 1;
  let best = readBest();
  let busy = false;
  let uid = 0;
  let muted = false;

  let CELL = 40;
  let GAP = 3;
  let PAD = 6;

  // ---------------------------------------------------------------- dom
  const boardEl = document.getElementById("board");
  const wrapEl = document.getElementById("wrap");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const stageEl = document.getElementById("stage");
  const infoEl = document.getElementById("info");
  const overlayEl = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovLines = document.getElementById("ovLines");
  const ovBtn = document.getElementById("ovBtn");
  const soundBtn = document.getElementById("sound");
  const restartBtn = document.getElementById("restart");

  // ---------------------------------------------------------------- audio
  let ac = null;

  function audio() {
    if (!ac) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ac = new Ctx();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }

  function tone(freq, dur, type, vol, delay, glide) {
    if (muted) return;
    const ctx = audio();
    if (!ctx) return;
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (glide) osc.frequency.exponentialRampToValueAtTime(freq * glide, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function sfxSelect() {
    tone(520, 0.07, "sine", 0.045, 0, 1.15);
  }

  function sfxPop(n) {
    const base = 300 + Math.min(n, 20) * 26;
    tone(base, 0.12, "triangle", 0.08, 0, 1.7);
    tone(base * 1.5, 0.16, "sine", 0.045, 0.02, 1.4);
    if (n >= 8) tone(base * 2, 0.2, "sine", 0.04, 0.06, 1.2);
  }

  function sfxStage() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "triangle", 0.07, i * 0.09));
  }

  // ---------------------------------------------------------------- layout
  function layout() {
    const rect = wrapEl.getBoundingClientRect();
    const cs = getComputedStyle(wrapEl);
    const availW = rect.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = rect.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const size = Math.max(180, Math.min(availW, availH, 560));

    CELL = Math.floor(size / 10.2);
    GAP = Math.max(2, Math.round(CELL * 0.075));
    PAD = GAP * 2;

    boardEl.style.width = CELL * COLS + GAP * 2 + "px";
    boardEl.style.height = CELL * ROWS + GAP * 2 + "px";
    document.documentElement.style.setProperty("--cell", CELL + "px");
    document.documentElement.style.setProperty("--gap", GAP + "px");
    document.documentElement.style.setProperty("--pad", PAD + "px");
    document.documentElement.style.setProperty("--tile", CELL - GAP * 2 + "px");

    boardEl.classList.add("noanim");
    for (const t of tiles.values()) place(t);
    // reflow, dann Übergänge wieder aktivieren
    void boardEl.offsetWidth;
    requestAnimationFrame(() => boardEl.classList.remove("noanim"));
  }

  function place(t) {
    t.el.style.transform =
      "translate3d(" + (t.c * CELL + PAD) + "px," + (t.r * CELL + PAD) + "px,0)";
  }

  // ---------------------------------------------------------------- board
  function emptyGrid() {
    return Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  }

  function makeTile(color, r, c) {
    const el = document.createElement("div");
    el.className = "tile";
    el.style.setProperty("--base", COLORS[color].base);
    el.style.setProperty("--light", COLORS[color].light);
    el.style.setProperty("--dark", COLORS[color].dark);
    el.style.setProperty("--d", String(r + c));
    el.innerHTML = '<div class="face"><div class="star"></div></div>';

    const tile = { id: ++uid, color, r, c, el };
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      onTile(tile);
    });
    boardEl.appendChild(el);
    place(tile);
    tiles.set(tile.id, tile);
    return tile;
  }

  function generateColors() {
    let colors;
    let guard = 0;
    do {
      colors = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => Math.floor(Math.random() * COLORS.length))
      );
      guard++;
    } while (!colorsHaveMoves(colors) && guard < 50);
    return colors;
  }

  function colorsHaveMoves(colors) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = colors[r][c];
        if (c < COLS - 1 && colors[r][c + 1] === v) return true;
        if (r < ROWS - 1 && colors[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function buildStage() {
    boardEl.innerHTML = "";
    tiles.clear();
    selected = [];
    grid = emptyGrid();

    const colors = generateColors();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        grid[r][c] = makeTile(colors[r][c], r, c);
      }
    }

    layout();
    updateHud();
    setInfo(countInfo());
  }

  // ---------------------------------------------------------------- rules
  function findGroup(r, c) {
    const start = grid[r] && grid[r][c];
    if (!start) return [];

    const color = start.color;
    const seen = new Set();
    const stack = [[r, c]];
    const out = [];

    while (stack.length) {
      const [y, x] = stack.pop();
      const key = y * COLS + x;
      if (seen.has(key)) continue;
      seen.add(key);

      const t = grid[y] && grid[y][x];
      if (!t || t.color !== color) continue;
      out.push(t);

      if (y > 0) stack.push([y - 1, x]);
      if (y < ROWS - 1) stack.push([y + 1, x]);
      if (x > 0) stack.push([y, x - 1]);
      if (x < COLS - 1) stack.push([y, x + 1]);
    }
    return out;
  }

  function hasMoves() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (!t) continue;
        if (c < COLS - 1 && grid[r][c + 1] && grid[r][c + 1].color === t.color) return true;
        if (r < ROWS - 1 && grid[r + 1][c] && grid[r + 1][c].color === t.color) return true;
      }
    }
    return false;
  }

  const pointsFor = (n) => 5 * n * n;

  // ---------------------------------------------------------------- input
  function onTile(tile) {
    if (busy) return;
    const group = findGroup(tile.r, tile.c);

    if (group.length < 2) {
      deselect();
      tile.el.classList.remove("bad");
      void tile.el.offsetWidth;
      tile.el.classList.add("bad");
      setTimeout(() => tile.el.classList.remove("bad"), 320);
      return;
    }

    if (selected.length && group.includes(selected[0])) {
      popGroup(group);
    } else {
      select(group);
    }
  }

  function select(group) {
    deselect();
    selected = group;
    for (const t of group) t.el.classList.add("sel");
    const n = group.length;
    setInfo(n + " Sterne · <b>+" + pointsFor(n) + "</b> Punkte – erneut tippen");
    sfxSelect();
  }

  function deselect() {
    for (const t of selected) t.el.classList.remove("sel");
    selected = [];
    setInfo(countInfo());
  }

  function countInfo() {
    return "<b>" + tiles.size + "</b> Blöcke übrig";
  }

  // ---------------------------------------------------------------- pop
  function popGroup(group) {
    busy = true;
    const n = group.length;
    const gain = pointsFor(n);

    score += gain;
    updateScore();
    showGain(group, gain);
    sfxPop(n);

    for (const t of group) {
      grid[t.r][t.c] = null;
      t.el.classList.remove("sel");
      t.el.classList.add("pop");
      burst(t);
      tiles.delete(t.id);
      const el = t.el;
      setTimeout(() => el.remove(), 300);
    }
    selected = [];

    collapse();

    setTimeout(() => {
      busy = false;
      updateHud();
      setInfo(countInfo());
      if (!hasMoves()) endStage();
    }, 320);
  }

  // Schwerkraft + Spalten nach links zusammenziehen
  function collapse() {
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const t = grid[r][c];
        if (!t) continue;
        if (write !== r) {
          grid[write][c] = t;
          grid[r][c] = null;
        }
        write--;
      }
    }

    let target = 0;
    for (let c = 0; c < COLS; c++) {
      let empty = true;
      for (let r = 0; r < ROWS; r++) {
        if (grid[r][c]) { empty = false; break; }
      }
      if (empty) continue;

      if (target !== c) {
        for (let r = 0; r < ROWS; r++) {
          grid[r][target] = grid[r][c];
          grid[r][c] = null;
        }
      }
      target++;
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (!t) continue;
        t.r = r;
        t.c = c;
        place(t);
      }
    }
  }

  function burst(tile) {
    const cx = tile.c * CELL + CELL / 2;
    const cy = tile.r * CELL + CELL / 2;
    const count = 4;

    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "p";
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      p.style.background = COLORS[tile.color].light;
      boardEl.appendChild(p);

      const ang = Math.random() * Math.PI * 2;
      const dist = CELL * (0.5 + Math.random() * 1.1);
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist;

      const anim = p.animate(
        [
          { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
          {
            transform:
              "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(.15)",
            opacity: 0,
          },
        ],
        { duration: 380 + Math.random() * 260, easing: "cubic-bezier(.2,.7,.4,1)" }
      );
      anim.onfinish = () => p.remove();
    }
  }

  function showGain(group, gain) {
    let sx = 0, sy = 0;
    for (const t of group) {
      sx += t.c * CELL + CELL / 2;
      sy += t.r * CELL + CELL / 2;
    }
    const el = document.createElement("div");
    el.className = "gain";
    el.textContent = "+" + gain;
    el.style.left = sx / group.length + "px";
    el.style.top = sy / group.length + "px";
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ---------------------------------------------------------------- stage
  function endStage() {
    const remaining = tiles.size;
    const bonus = remaining <= 10 ? Math.max(0, 2000 - 20 * remaining * remaining) : 0;

    if (bonus > 0) {
      score += bonus;
      updateScore();
      sfxStage();
    }

    saveBest();

    const rows = [
      ["Blöcke übrig", String(remaining)],
      ["Bonus", bonus > 0 ? "+" + bonus : "–"],
      ["Punkte gesamt", score.toLocaleString("de-DE")],
    ];

    if (best > 0 && score >= best) rows.push(["Neuer Rekord", "★"]);

    openOverlay(
      "Stage " + stage + " geschafft",
      bonus > 0
        ? "Stark! Für die übrigen Blöcke gibt es einen Bonus."
        : "Kein Bonus – es waren mehr als 10 Blöcke übrig.",
      rows,
      "Nächste Stage",
      () => {
        stage++;
        stageEl.textContent = stage;
        buildStage();
        hideOverlay();
      }
    );
  }

  function restart() {
    stage = 1;
    score = 0;
    shownScore = 0;
    stageEl.textContent = "1";
    updateScore(true);
    buildStage();
    hideOverlay();
  }

  // ---------------------------------------------------------------- hud
  let scoreRaf = 0;

  function updateScore(instant) {
    if (instant) {
      shownScore = score;
      scoreEl.textContent = score.toLocaleString("de-DE");
      return;
    }
    cancelAnimationFrame(scoreRaf);
    const start = shownScore;
    const target = score;
    const t0 = performance.now();
    const dur = 340;

    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      shownScore = Math.round(start + (target - start) * e);
      scoreEl.textContent = shownScore.toLocaleString("de-DE");
      if (k < 1) scoreRaf = requestAnimationFrame(step);
    };
    scoreRaf = requestAnimationFrame(step);
  }

  function updateHud() {
    bestEl.textContent = Math.max(best, score).toLocaleString("de-DE");
  }

  function setInfo(html) {
    infoEl.innerHTML = html;
  }

  function saveBest() {
    if (score > best) {
      best = score;
      writeBest(best);
    }
    updateHud();
  }

  // ---------------------------------------------------------------- overlay
  function openOverlay(title, text, rows, btnLabel, onClick) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovLines.innerHTML = "";
    for (const [k, v] of rows) {
      const div = document.createElement("div");
      div.className = "line";
      div.innerHTML = "<span>" + k + "</span><b>" + v + "</b>";
      ovLines.appendChild(div);
    }
    ovBtn.textContent = btnLabel;
    ovBtn.onclick = onClick;
    overlayEl.classList.remove("hidden");
  }

  function hideOverlay() {
    overlayEl.classList.add("hidden");
  }

  // ---------------------------------------------------------------- boot
  soundBtn.addEventListener("click", () => {
    muted = !muted;
    soundBtn.textContent = muted ? "🔇" : "🔊";
    if (!muted) sfxSelect();
  });

  restartBtn.addEventListener("click", () => {
    if (busy) return;
    const ok = score === 0 || window.confirm("Wirklich neu starten? Der Punktestand geht verloren.");
    if (ok) restart();
  });

  boardEl.addEventListener("pointerdown", (e) => {
    if (e.target === boardEl) deselect();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") deselect();
  });

  window.addEventListener("resize", layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(wrapEl);

  window.addEventListener("beforeunload", saveBest);

  bestEl.textContent = best.toLocaleString("de-DE");

  buildStage();
  updateScore(true);

  openOverlay(
    "Pop Star",
    "Tippe auf zusammenhängende Sterne (2 oder mehr) – tippe ein zweites Mal, um sie platzen zu lassen. Je größer die Gruppe, desto mehr Punkte.",
    [
      ["Formel", "5 × Blöcke²"],
      ["Ziel", "Möglichst viele Stages"],
    ],
    "Los geht's",
    () => {
      hideOverlay();
      audio();
      layout();
    }
  );
})();
</script>
</body>
</html>
